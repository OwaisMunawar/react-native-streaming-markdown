version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # React, React Native and native modules follow the Expo SDK used by the example.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-dom
      - dependency-name: '@react-native/*'
      - dependency-name: 'react-native-*'
      - dependency-name: 'expo*'
      # Major tooling upgrades (ESLint, TypeScript, Jest) are done by hand.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
